<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Repositorios de GitHub</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h1 class="mb-4">Buscar repositorios de GitHub</h1>

    <div class="mb-3">
        <label for="usuario" class="form-label">Nombre de usuario:</label>
        <input type="text"
               id="usuario"
               class="form-control"
               placeholder="Introduce un usuario de GitHub">
    </div>

    <button id="buscar" class="btn btn-primary">
        Buscar
    </button>

    <div id="mensaje" class="mt-3"></div>

    <table class="table table-striped mt-4" id="tabla">
        <thead>
        <tr>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Seguidores</th>
        </tr>
        </thead>

        <tbody id="repositorios">
        </tbody>
    </table>

</div>


<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/app.js"></script>

</body>
</html>
